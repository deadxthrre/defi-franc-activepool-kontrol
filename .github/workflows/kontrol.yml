name: Kontrol ActivePool Verification

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kontrol-activepool-${{ github.ref }}
  cancel-in-progress: true

env:
  KONTROL_IMAGE: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255

jobs:
  kontrol-prove:
    name: kontrol prove (DeFi Franc ActivePool)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pull Kontrol image
        run: docker pull "$KONTROL_IMAGE"

      - name: Make workspace writable by container user
        run: chmod -R a+rwX "$PWD"

      - name: Cache Kontrol build artifacts
        uses: actions/cache@v4
        with:
          path: out
          key: kontrol-${{ runner.os }}-${{ hashFiles('src/**', 'test/**', 'lib/**', 'foundry.toml') }}
          restore-keys: |
            kontrol-${{ runner.os }}-

      - name: Build Kontrol definition
        run: |
          docker run --rm -u user -e HOME=/home/user \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'kontrol build --verbose'

      - name: Prove group 1 (permissionless / access control)
        id: g1
        continue-on-error: true
        run: |
          docker run --rm -u user -e HOME=/home/user \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'kontrol prove --match-test "ActivePoolPropertiesTest.check_external_attacker_cannot_send_eth" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-eth.xml'

      - name: Prove group 2 (ERC20 + cross-asset)
        id: g2
        continue-on-error: true
        run: |
          docker run --rm -u user -e HOME=/home/user \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'kontrol prove --match-test "ActivePoolPropertiesTest.check_external_attacker_cannot_send_erc20" --match-test "ActivePoolPropertiesTest.check_sp_of_other_asset_cannot_drain" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-erc20.xml'

      - name: Prove group 3 (accounting invariants)
        id: g3
        continue-on-error: true
        run: |
          docker run --rm -u user -e HOME=/home/user \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'kontrol prove --match-test "ActivePoolPropertiesTest.check_authorized_sp_eth_withdraw_decreases_balance_by_amount" --match-test "ActivePoolPropertiesTest.check_cannot_send_more_than_recorded_balance" --match-test "ActivePoolPropertiesTest.check_received_erc20_deposit_tracking" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-accounting.xml'

      - name: Diagnose failing proofs
        if: steps.g1.outcome == 'failure' || steps.g2.outcome == 'failure' || steps.g3.outcome == 'failure'
        run: |
          for t in \
            "ActivePoolPropertiesTest.check_external_attacker_cannot_send_eth(uint256,address)" \
            "ActivePoolPropertiesTest.check_external_attacker_cannot_send_erc20(uint256,address)" \
            "ActivePoolPropertiesTest.check_sp_of_other_asset_cannot_drain(uint256)" \
            "ActivePoolPropertiesTest.check_authorized_sp_eth_withdraw_decreases_balance_by_amount(uint256)" \
            "ActivePoolPropertiesTest.check_cannot_send_more_than_recorded_balance(uint256,uint256)" \
            "ActivePoolPropertiesTest.check_received_erc20_deposit_tracking(uint256)" ; do
            echo "=================== show: $t ==================="
            docker run --rm -u user -e HOME=/home/user \
              -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
              bash -c "kontrol show '$t' --failure-info --pending --failing --verbose" 2>&1 || true
          done

      - name: Upload reports and proof data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-reports
          path: |
            kontrol-prove-*.xml
            out/proofs
          if-no-files-found: ignore

      - name: Fail if any property group failed
        if: steps.g1.outcome == 'failure' || steps.g2.outcome == 'failure' || steps.g3.outcome == 'failure'
        run: |
          echo "One or more Kontrol property groups failed (see 'Diagnose failing proofs' above)."
          exit 1