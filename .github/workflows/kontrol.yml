name: Kontrol ActivePool Verification

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kontrol-activepool-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prebuilt image: contains K + KEVM + Kontrol + Foundry. Nothing to compile
  # on the runner, which avoids the OOM-kill seen when `kup` builds the
  # toolchain on a 2-core/7GB ubuntu-latest runner.
  KONTROL_IMAGE: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255

jobs:
  kontrol-prove:
    name: kontrol prove (DeFi Franc ActivePool)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pull Kontrol image
        run: docker pull "$KONTROL_IMAGE"

      - name: Cache Kontrol build artifacts
        uses: actions/cache@v4
        with:
          path: out
          key: kontrol-${{ runner.os }}-${{ hashFiles('src/**', 'test/**', 'lib/**', 'foundry.toml') }}
          restore-keys: |
            kontrol-${{ runner.os }}-

      - name: Build Kontrol definition
        run: |
          docker run --rm --user root -e HOME=/root \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'export PATH=/home/user/.local/bin:/home/user/.foundry/bin:$PATH; kontrol build --verbose'

      - name: Prove drain properties (permissionless / access control)
        run: |
          docker run --rm --user root -e HOME=/root \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'export PATH=/home/user/.local/bin:/home/user/.foundry/bin:$PATH; kontrol prove --match-test "ActivePoolPropertiesTest.check_external_attacker_cannot_send_eth" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-eth.xml'

      - name: Prove drain properties (ERC20 + cross-asset)
        run: |
          docker run --rm --user root -e HOME=/root \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'export PATH=/home/user/.local/bin:/home/user/.foundry/bin:$PATH; kontrol prove --match-test "ActivePoolPropertiesTest.check_external_attacker_cannot_send_erc20" --match-test "ActivePoolPropertiesTest.check_sp_of_other_asset_cannot_drain" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-erc20.xml'

      - name: Prove accounting invariants
        run: |
          docker run --rm --user root -e HOME=/root \
            -v "$PWD":/work -w /work "$KONTROL_IMAGE" \
            bash -c 'export PATH=/home/user/.local/bin:/home/user/.foundry/bin:$PATH; kontrol prove --match-test "ActivePoolPropertiesTest.check_authorized_sp_eth_withdraw_decreases_balance_by_amount" --match-test "ActivePoolPropertiesTest.check_cannot_send_more_than_recorded_balance" --match-test "ActivePoolPropertiesTest.check_received_erc20_deposit_tracking" --reinit --workers 2 --xml-test-report --xml-test-report-name kontrol-prove-accounting.xml'

      - name: Upload proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-reports
          path: |
            kontrol-prove-*.xml
            out/proofs/**/proof.json
          if-no-files-found: ignore